<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05070b" />
  <title>Bad Time Simulator — Remaster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}
  </script>
</head>
<body>
  <main id="app" class="intro">
    <canvas id="world" aria-label="3D Bad Time Simulator game"></canvas>
    <canvas id="flames" aria-hidden="true"></canvas>
    <div class="vignette"></div>
    <div class="noise"></div>
    <div class="hud">
      <div class="brand-mark"><span class="brand-dot"></span> UNDERGROUND // ENCOUNTER 01</div>
      <div class="sound-toggle" id="soundToggle" role="button" tabindex="0" aria-label="Toggle sound"><span class="sound-bars"><i></i><i></i><i></i></span><span id="soundLabel">SOUND OFF</span></div>
    </div>
    <section class="title-stack" aria-label="Bad Time Simulator Remaster">
      <div class="eyebrow">A VERY BAD TIME AWAITS</div>
      <h1 class="title-main">BAD TIME</h1>
      <div class="title-sub">SIMULATOR</div>
      <div class="title-edition">REMASTER</div>
    </section>
    <div class="intro-caption"><span class="caption-line"></span><span>THE SKELETON WHO SLEEPS WITH HIS EYES OPEN</span></div>
    <div class="bottom-meta"><span>PREPARE YOUR SOUL</span><span>© 2025 · LAST CORRIDOR</span></div>
    <button id="readyButton" class="ready-button" type="button"><span>READY</span><b>→</b></button>
    <div id="blackout" class="blackout"></div>
    <div class="corridor-hud"><span class="corridor-label">JUDGEMENT HALL</span><span class="corridor-prompt" id="corridorPrompt">WASD / JOYSTICK TO WALK</span></div>
    <div class="mobile-controls" id="mobileControls" aria-label="Touch controls">
      <div class="joystick" id="joystick" aria-label="Movement joystick"><div class="joystick-ring"></div><div class="joystick-thumb" id="joystickThumb"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 1h4v2h2v2h2v5h-2v2h-2v2H6v-2H4v-2H2V5h2V3h2z"/></svg></div></div>
      <button id="jumpButton" class="jump-button" type="button" aria-label="Jump"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4 5 15h6v12h10V15h6z"/></svg><span>JUMP</span></button>
    </div>
    <div id="toast" class="toast" role="status"></div>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
